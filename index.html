<script type="text/plain" id="istruzioni">
# Agenda docente — istruzioni per rifarla uguale

Documento di prodotto. Chi lo legge deve ricostruire la stessa app: stesso nome, stessa lingua, stessi colori, stessi menu, stessi testi e stessi comportamenti. Non aggiungere sezioni che qui non ci sono. Non tradurre in inglese. L’utente è un docente italiano.

Nome visibile, anche sull’icona della Home di iPhone: **Agenda docente**. Mai “Grok App”.

## 1. Cos’è

Agenda personale del docente. Una sola persona, un account. Tiene:

- la giornata di oggi
- il calendario degli impegni e il calendario delle lezioni svolte
- l’orario settimanale
- le classi, gli alunni, i voti e le annotazioni
- attività, assenze, note, contatti, documenti
- promemoria e impostazioni

I dati restano nel browser di questo dispositivo (localStorage e, per i file, IndexedDB). Non c’è un account. Un altro browser o un altro telefono non vede questa agenda.

## 2. Aspetto, quando la apri

App a telefono, una colonna, a tutto schermo. Niente menu laterale. Niente header con il logo. Lo sfondo arriva fino ai bordi. I contenuti scorrono sotto la barra in basso.

Tipografia:

- Titoli (h1, h2, titolo della schermata di accesso): **Lato**, altrimenti il font di sistema.
- Testo, pulsanti, menu: **Lato**, altrimenti il font di sistema.
- h1: 26px, peso 600. Sottotitolo `.sub`: colore secondario, sotto il titolo.
- Corpo: 16px, interlinea 1.5.

Tema predefinito: **Come il telefono**. Si può forzare Chiaro o Scuro. I colori sono variabili, non colori sparsi.

Chiaro:

| Uso | Colore |
|---|---|
| Sfondo | `#f5f6fa` |
| Card | `#ffffff` |
| Testo | `#151d3b` |
| Testo secondario | `#4b5679` |
| Linee | `#dde2ee` |
| Blu (azione, tab attivo) | `#2340a8` |
| Blu chiaro (sfondo attivo) | `#e4eafb` |
| Testo su blu | `#ffffff` |
| Rosso | `#c22d2d` su sfondo `#fce7e5` |
| Verde | `#1f6b57` su sfondo `#ddf1ea` |
| Evidenza “in corso” | sfondo `#ffe580`, testo `#151d3b` |

Scuro (e “come il telefono” di sera):

| Uso | Colore |
|---|---|
| Sfondo | `#0f1424` |
| Card | `#171f36` |
| Testo | `#e9edfa` |
| Testo secondario | `#a2adcb` |
| Linee | `#2a3453` |
| Blu | `#94aaff` |
| Blu scuro (tab attivo) | `#1f2b57` |
| Testo su blu | `#0f1424` |
| Rosso | `#ff8079` su `#4a2226` |
| Verde | `#77d1b4` su `#1c3b33` |
| Evidenza | `#8a7620`, testo `#fff6c9` |

Forme:

- Card e fogli: raggio 18px.
- Pulsante pieno: raggio 10px, padding 10px 16px, testo 16px grassetto, sfondo blu, testo `--on-blue`.
- Pulsante fantasma: bordo linea, sfondo trasparente, testo normale.
- Pulsante pericolo: bordo e testo rosso, sfondo trasparente.
- Chip (etichette piccole): pillola, 12px, grassetto. Blu di default, varianti rosso, verde, grigio, “in corso” giallo.
- Righe elenco: niente card. Una riga flex, icona blu a sinistra (28px), titolo grassetto, sottotitolo secondario, chevron a destra, linea sotto. Altezza comoda al tocco, gap 12px.
- Fogli modali: dal basso, card, angoli alti arrotondati, max 520px. Due pulsanti in fondo: azione principale e Annulla. Le eliminazioni chiedono un secondo tocco (“Tocca ancora” / “Confermi?”).
- Pulsante + tondo, 54px, blu, fisso in basso a destra, sopra la barra. Nascosto in Altro, Strumenti, Promemoria, Impostazioni, Privacy.

Barra in basso, sempre visibile:

- Capsula flottante, non attaccata ai bordi. Sfondo della card al 58% di opacità, blur 24px, bordo linea, ombra morbida, raggio 36px.
- Cinque voci, icona sopra e nome sotto, 12px: **Oggi, Calendario, Orario, Classi, Altro**.
- Voce attiva: pillola blu chiaro, icona e testo blu, grassetto. Le altre sono secondarie, opacità 0.72.
- Icone a tratto, spessore 1.8, non piene. Casa, calendario, orologio, due persone, tre punti.

In alto, sotto l’area sicura del telefono, un pulsante scuola: nome della scuola corrente e freccia giù. Apre il foglio “Le tue scuole”.

Icona dell’app (Home e favicon): sfondo azzurro ghiaccio chiaro, libro e penna blu navy. Stessa icona a 192, 512 e apple-touch. Il nome sull’icona salvata è sempre Agenda docente.

Stile morbido (vale per Oggi, Calendario e Orario):

- Font **Lato** da Google Fonts, pesi 400, 700 e 900. h1 26px. Titoli di sezione (h2) 19px grassetto, con 26px sopra e 10px sotto. Tra una scheda e l’altra sempre 10px.
- Schede bianche senza bordo, raggio 22px, ombra morbida `0 2px 12px rgba(35,64,168,.08)`.
- Pillole azzurre per i pulsanti secondari: sfondo blu chiaro, testo blu 14px grassetto, raggio 12px, padding 9px 14px, icona a tratto 16px a sinistra. Al tocco si abbassano un poco (scala .96). Le pillole stanno in righe flessibili con 10px di spazio.
- Elementi evidenziati (giorno selezionato, ora in corso): blu pieno con ombra azzurra sotto `0 6px 14px -4px rgba(35,64,168,.5)`.
- La pagina dichiara il tema (`color-scheme` chiaro, scuro se il telefono o l’utente lo chiedono), così caselle e campi non diventano neri dentro i riquadri incorporati.
- Nessun pulsante ha il bordo. Sulla pagina grigia i pulsanti bianchi hanno l’ombra morbida; dentro i fogli bianchi che si aprono dal basso sono grigio chiarissimo. Pulsanti pieni blu con un’ombra azzurra leggera, pulsanti pericolosi in rosso chiaro (`--red-bg`).
- Angoli: schede 22px; pulsanti e controlli (lente, scelta della scuola, “Torna a oggi”, “Chiudi” nella ricerca, pulsanti ghost, frecce del mese, etichette alunno, spunta e X) 12px; elementi grandi come le caselle dei giorni e i tab Impegni/Lezioni 16px; “a” degli assenti 10px.
- Tab (Impegni/Lezioni e simili): senza bordo, bianchi con ombra morbida; quello scelto è blu pieno con ombra azzurra. Frecce del mese: quadratini azzurri 40px con freccia blu, senza bordo.
- Moduli (i fogli che si aprono dal basso: Nuovo impegno, voto, alunno, ecc.): angoli in alto 28px, titolo 19px. Campi di testo, data, ora, menù a tendina e note senza bordo, fondo grigio chiarissimo, angoli 12px, alti almeno 46px; quando sono attivi diventano bianchi con un contorno blu di 2px. Etichette sopra i campi 13px in grassetto. In fondo, pulsanti alti 46px: “Salva” blu con ombra, “Annulla” grigio chiaro.
- I fogli si chiudono anche trascinandoli verso il basso partendo da un campo di testo, se il movimento è chiaramente verso il basso (il cursore non si sposta); chiudendoli si chiude anche la tastiera. Una casella di testo lunga che scorre mantiene il suo scorrimento.
- Navigazione: si passa da Oggi a Calendario, Orario, Classi e Altro anche trascinando il dito a destra e a sinistra sullo schermo. Trascinando sulla barra in basso la pagina cambia solo quando si stacca il dito. I fogli si chiudono trascinandoli verso il basso.

## 3. Ingresso

Questa copia non ha login. All’apertura si entra subito su Oggi. L’agenda è vuota la prima volta, poi ritrova i dati salvati su questo dispositivo. Niente Google, niente X, niente email, niente password. La schermata «La tua agenda di scuola, sempre con te» non c’è.

## 4. Mappa dei menu

Barra:

1. Oggi
2. Calendario, con due tab: Impegni | Lezioni
3. Orario
4. Classi, poi la classe, poi l’alunno
5. Altro

Altro, elenco di righe:

Poi una linea e:

| Impostazioni | Promemoria, aspetto e backup dei dati |

Impostazioni, in ordine, senza riquadri extra tranne l’account:

1. Riquadro Account: cerchio con l’iniziale, nome «Docente» e «Su questo dispositivo» di fianco al cerchio, non sotto. Testo: i dati restano su questo dispositivo. Pulsante “Crea un codice di recupero”: è solo un appunto, non serve a rientrare da un altro telefono.
2. Promemoria, riga con campanella.
3. Aspetto, riga con sole e menu a tendina: Come il telefono / Chiaro / Scuro. Una sola linea sotto.
4. Privacy, riga con scudo: “Informativa ed elimina dati”.
5. Esci dall’account, riga con icona di uscita. Non chiude una sessione: avvisa che non c’è un accesso e che i dati restano su questo dispositivo.

Strumenti pratici: Squadre e gruppi; Timer e cronometro.

Il + dipende dalla schermata: impegno, lezione in orario, attività, contatto, nota, classe, voto, assenza, file dell’archivio, scheda lezione nel calendario lezioni.

## 5. Scuola in alto

Foglio “Le tue scuole”. Testo: “Scegli la scuola da vedere. Con Tutte le scuole trovi insieme gli impegni di ognuna.”

- Una riga per scuola, con spunta su quella attiva
- Riga “Tutte le scuole”
- Aggiungi una scuola
- Su una scuola: modifica nome, oppure elimina. Eliminare chiede conferma esplicita e cancella i dati di quella scuola
- Chiudi

Con “Tutte le scuole” gli elenchi mostrano un chip grigio col nome della scuola. In orario, sotto la classe c’è il nome della scuola (esempio “3E” e sotto “Frank”), non la materia. Ogni scuola ha un colore diverso prima che l’utente cambi i colori. I colori si modificano solo dopo aver scelto una scuola, non in “Tutte”.

Ore predefinite, sei: 08:00–09:00, 09:00–10:00, 10:00–11:00, 11:00–12:00, 12:00–13:00, 13:00–14:00. Si possono cambiare per scuola.

## 6. Oggi

Titolo: “Mercoledì 9 settembre” (giorno, numero, mese in lettere). Sottotitolo: “2 lezioni e 1 impegno”, oppure “Nessuna lezione né impegni oggi”.

Striscia della settimana: sette caselle (giorno corto e numero), una settimana per volta, scorrevole. Caselle bianche senza bordo, raggio 18px, ombra morbida. Giorno selezionato: blu pieno con ombra azzurra. Oggi, se non è il selezionato: contorno blu sottile e scritta “oggi”. Giorno con impegni: barra blu spessa 6px sul fondo. Se si guarda un altro giorno, il pulsante “Torna a oggi”.

Se c’è un impegno futuro: titolo “Prossimo impegno” e una scheda bianca uguale alle altre (quando, titolo sottolineato come con un evidenziatore, tipo e luogo). Il titolo sta vicino alla scheda.

“La giornata”: titolo fuori da ogni riquadro, poi lezioni e impegni di quel giorno in ordine di ora, ognuno in una scheda bianca separata (barretta colorata a sinistra, titolo, sottotitolo, ora e fine a destra). Le lezioni non hanno icona a destra; gli impegni hanno la matita. Chip “Annotata” se la scheda lezione c’è già.

- Toccando una lezione che non è in corso si apre un menù con solo **Scheda lezione** ed **Elenco della classe**. Toccando un impegno lo si modifica.
- La lezione in corso (solo se si guarda oggi) sta al suo posto nell’ordine ed è una scheda **blu** (`#2340a8`) alta come le altre: striscia del colore della classe a sinistra, materia in grassetto e classe sotto, a destra un chip “In corso” con pallino verde e sotto l’orario, e un cerchio con una freccia giù. Toccando la scheda si apre lo stesso menù delle altre lezioni (Scheda lezione, Elenco della classe); la scheda si abbassa un poco al tocco.
- La freccia apre il menù a tendina **Strumenti**: un pannello azzurro (`#e4eafb`) attaccato solo al bordo basso della scheda blu, con gli angoli bassi arrotondati, che contiene tre pulsanti bianchi quadrati con un’icona in un quadratino azzurro: **A chi tocca?**, **Squadre e gruppi**, **Controllo materiale**. Agiscono sulla classe della lezione in corso: A chi tocca? apre l’estrazione, Squadre e gruppi si apre già su quella classe, Controllo materiale apre una verifica di tipo materiale. All’apertura dell’app il pannello è chiuso. I tre pulsanti compaiono solo oggi e solo se c’è una lezione in corso; altrimenti non ci sono (gli strumenti restano in Altro).
- Verifica materiale: ogni alunno ha un quadratino piccolo con la “a” (assente) prima di spunta e X. La “a” segna l’assenza per tutta la giornata, valida anche in Squadre e gruppi e in A chi tocca. Premere spunta o X su un assente lo fa tornare presente. “Tutti hanno il materiale” salta gli assenti.

Se la giornata è vuota: “Giornata libera. Inserisci le tue lezioni nell’orario o aggiungi un impegno con il pulsante +.” e la pillola “Apri l’orario” (icona orologio).

Poi “Da fare”: attività non completate in scadenza entro 7 giorni, massimo 4, ognuna in una scheda bianca, poi la pillola “Tutte le attività” (icona spunta). Se non ce ne sono: “Niente in scadenza nei prossimi sette giorni.” e la pillola “Apri le attività”.

## 7. Calendario

Due tab: **Impegni** e **Lezioni**.

Mese in una scheda bianca con frecce, griglia lun–dom (L M M G V S D). Oggi ha un contorno blu. Il giorno scelto è un quadrato blu arrotondato con un anello. Sotto i giorni, puntini rossi: uno per ogni impegno (o scheda, in Lezioni).

Impegni: sotto il mese, il titolo del giorno scelto, poi “Tocca un impegno per modificarlo.” e gli impegni come schede bianche. Vuoto: “Nessun impegno in questo giorno.” Sotto, due righe di pillole azzurre:

1. **Aggiungi impegno** (icona più) e **Aggiungi da file** (icona foglio con freccia in su; accetta pdf, docx, txt, csv).
2. **Elimina impegni da file** (icona cestino) e **PDF** (icona scarica).

“Elimina impegni da file” compare solo se ci sono impegni aggiunti da file; toglie solo quelli e chiede conferma (“Confermi? Elimina N impegni aggiunti da file” e Annulla). “PDF” esporta il mese: titolo “Impegni di ottobre 2026”, sotto il nome della scuola; ogni voce “gio 1 ottobre, ore 08:00-14:00” e titolo con tipo. Il PDF si apre nel lettore del telefono (Safari), non in un riquadro interno.

Lezioni: prima la lista delle classi. Testo: “Scegli una classe per vedere e annotare le lezioni svolte, giorno per giorno.” Riga “Classe 1C Frank” e “3 schede” oppure “Nessuna scheda ancora”.

Dentro una classe: “Cambia classe”, il mese, poi “Classe 1C Frank · Mercoledì 9 settembre” con una pillola **PDF** accanto al titolo. Per quel giorno si vedono, in schede con la striscia colorata a sinistra, le ore dell’orario e le schede già scritte. Chip “Fatta” se c’è un argomento. Vuoto: “Nessuna lezione di questa classe in questo giorno.” Più “Aggiungi scheda lezione”. Il PDF elenca data, materia, argomento e note della classe in cui sei; se non ci sono schede avvisa e non crea un file vuoto.

Se è selezionato “Tutte le scuole”, il calendario lezioni dice di scegliere una scuola.

## 8. Orario

Titolo Orario. Sottotitolo: “Le tue ore di lezione. Tocca una casella per aggiungere o modificare.”

Griglia dentro una scheda bianca (raggio 24px): intestazioni dei giorni Lun–Ven in alto, colonna delle ore a sinistra (1ª … 6ª, con l’orario di inizio sotto). Il sabato compare se c’è una lezione il sabato, oppure con la pillola “Sabato”. Tra le ore, una riga con linea e testo (“Intervallo” o “Pausa”).

Le caselle sono **quadrate** (larghezza uguale all’altezza), raggio 16px, 5px di spazio tra loro. Vuota: sfondo del colore della pagina, senza bordo. Piena: riempimento del colore della classe, bordo spesso 2,5px del colore della materia, classe in grassetto e materia sotto, aula se c’è. Più lezioni nella stessa ora: stanno una sotto l’altra nella stessa casella, che diventa più alta. Testo sotto la griglia: “Il riempimento del quadratino indica la classe, il bordo la materia.” Con tutte le scuole: “Sotto la classe c’è il nome della scuola, per esempio 3E e Frank.”

Evidenza dell’ora in corso, solo se si guarda un giorno di lezione: il giorno nell’intestazione è una pillola blu piena con ombra azzurra; l’ora nella colonna a sinistra è una capsula blu piena con la stessa ombra; la casella in corso ha un anello blu spesso circa 3,5px staccato da 3px di bianco, ombra azzurra sotto, sopra le caselle vicine. Dentro la casella non c’è nessuna etichetta “In corso”.

Sotto, pillole azzurre con icona: **Sabato** (più, o meno se il sabato è già visibile), **Colori** (tavolozza), **Ore** (orologio, modifica le ore), **PDF** (scarica) e **Da file o foto** (fotocamera, legge l’orario da un file o da una foto). Con tutte le scuole c’è solo “Sabato”; le altre compaiono con una scuola scelta. **PDF** crea “Orario settimanale” con il nome della scuola: una tabella con le ore in verticale (con l’orario di inizio) e i giorni in orizzontale, in ogni casella classe e materia (più lezioni separate da una barra), il sabato solo se visibile.

Colori: un colore per classe e uno per materia, dieci coppie. Se rinomini una classe, il colore segue il nome nuovo e il vecchio non resta in elenco.

## 9. Classi

Elenco: nome, materia, numero di alunni, chip “Media 7,5” (rosso se sotto 6). Icona matita per modificare. Vuoto: “Non hai ancora classi.”

Dentro la classe: “Nuova verifica”, “Aggiungi alunni”, “Modifica classe”, “Esporta in PDF”. Poi le verifiche (tocco per modificarle) e gli alunni. Avviso: “Nomi, voti e annotazioni restano sul tuo dispositivo e, se hai fatto l’accesso, nel tuo account. Per proteggere gli alunni puoi usare cognome e iniziale oppure il numero di registro.”

Aggiungere alunni: foglio “Aggiungi alunni”. Una riga per alunno: a sinistra il campo del nome (“Cognome Nome”), a destra un piccolo menù a tendina con “—”, M e F (il sesso è facoltativo). Si scrive un nome e si preme Invio per passare alla riga dopo; se si era all’ultima, ne compare una nuova già con il cursore (sulla tastiera il tasto dice “Avanti”). Invio su una riga vuota non fa nulla. C’è anche “Aggiungi riga”. Le righe vuote si ignorano, i doppioni (stesso nome nella classe) si saltano. Senza nessun nome: “Scrivi almeno un nome.” Dopo il salvataggio: “Ho aggiunto N alunni.”

Alunno: nome, sesso facoltativo (menù: Non indicato, Maschio, Femmina), bisogni facoltativi BES, DSA, PDP, Altro bisogno (chip rossi). Poi voti e annotazioni personali. Nella lista della classe, accanto al nome compare una piccola etichetta azzurra “M” o “F” se il sesso è indicato. Il campo `sex` ('' , 'M' o 'F') sta nell’alunno; i dati e i backup vecchi senza questo campo funzionano lo stesso.

Voto: da 0 a 10, si accettano 7, 7,5 e 7+. Tipo: Prova scritta, Interrogazione, Prova pratica, Altro. Data e descrizione facoltativa.

Esporta in PDF: un menu a tendina per scegliere tra Lezioni (le schede lezione), Materiale (chi aveva il materiale, verifica per verifica) e Voti (voti e media di ogni alunno).

## 10. Altro, schermata per schermata

**Attività.** Filtri Tipo e Classe (anche “Senza classe”). Da fare / Completate. “Elimina le completate”. Tipi: Riunioni, Verifiche, Consegne, Correzioni, Altro. Campi: cosa devi fare, tipo, classe facoltativa, data.

**Strumenti.** Squadre e gruppi: scegli la classe, dividi in squadre o gruppi bilanciati, mescola. Se tra i presenti ci sono sia maschi sia femmine compare, sotto “N presenti su M”, la riga “Equilibra maschi e femmine” (casella, già attiva) con il conteggio, per esempio “9 M, 11 F”. Se è attiva, maschi e femmine si distribuiscono in modo uniforme tra le squadre o i gruppi (si dispongono prima i maschi, poi le femmine, poi chi non ha il sesso indicato, a turno, con un punto di partenza casuale). Accanto a ogni squadra o gruppo compare il conteggio, per esempio “Squadra 1 · 5 M, 5 F”. Cambiare la casella cancella il risultato precedente. Timer e cronometro: due tab, per i tempi della lezione.

**Assenze e permessi.** Anno scolastico dal 1 settembre al 31 agosto. In cima il totale giorni per tipo: Malattia, Permesso retribuito, Legge 104, Altro. Poi il registro, dal più recente. Campi: data, tipo, giorni (1 o 0,5), motivo. Il + aggiunge una voce.

**Annotazioni.** Elenco per data di modifica. Titolo facoltativo e testo. Tocca per modificare.

**Archivio.**

- Impegni: “Scegli la programmazione o il piano annuale: leggo le date e, dopo il tuo ok, le aggiungo al calendario.” File PDF, Word docx, txt, csv, massimo 15 MB. Il testo si legge sul dispositivo. Poi, se c’è la chiave dell’IA, il testo (non il file) va all’IA per estrarre date, orari e titoli. Si apre “Impegni trovati”: “Letto con l’aiuto dell’IA.” se ha risposto lei, altrimenti il lettore interno. Si può togliere la spunta. Niente entra nel calendario senza “Aggiungi”. I .doc vecchi e le scansioni senza testo non si leggono qui. In fondo si possono eliminare solo gli impegni arrivati da file, oppure tutti quelli della scuola, sempre con conferma.
- Moduli: infortunio, autorizzazione uscite/tornei, verbale, relazione, altro. Toccare un PDF lo apre nel lettore del telefono, come l’esportazione del mese, non in un riquadro interno. Si salva solo il file, non un secondo file col nome.
- Materiali: schede e dispense, raggruppate per classe.
- Foto: circolari, giustificazioni, certificati. Si aprono nell’app come foto, senza lettura obbligatoria del testo.
- Link: nome e URL, si aprono fuori.

**Menu Altro e Impostazioni.** Il menu Altro è un elenco di schede bianche (icona, titolo, sottotitolo, freccia), con la striscia colorata dove serve. “Ore collegiali” ha il sottotitolo su due righe: “Collegi docenti e consigli di classe:” e, a capo, “le 40 + 40 ore”. Impostazioni: Profilo, Promemoria e Backup in schede bianche; sotto una scheda “Aspetto” con la scritta a sinistra e, a destra, il menù a tendina per il tema; poi Privacy in una scheda. Attività, Assenze e permessi e Annotazioni hanno gli elenchi in schede e le liste vuote con lo stesso stile.

File fino a 3 MB seguono l’account, al massimo 50 MB in tutto. Quelli più grandi restano solo sul telefono, e l’app lo dice.

**Contatti.** Cerca per nome o ruolo. Gruppi: Segreteria e presidenza, Colleghi, Altri contatti. Ogni contatto è una scheda bianca con il nome a sinistra e la pillola azzurra “Modifica” a destra; telefono e email sono pillole azzurre con icona che chiamano o scrivono. Lo spazio interno della scheda è 16px su ogni lato. Campi: nome, gruppo, ruolo, telefono, email.

## 11. Promemoria e privacy

Promemoria. Sottotitolo: “Con l’icona sulla Home gli avvisi arrivano anche a agenda chiusa. Puoi ancora aggiungere gli impegni al Calendario.”

Card Notifiche: “Attiva le notifiche”. Se il telefono le ha già concesse e l’app è sulla Home, gli avvisi arrivano anche a app chiusa. Altrimenti solo con l’app aperta. “Disattiva le notifiche” le spegne.

Impegni: avviso prima dell’inizio (nessuno, 5, 15, 30 minuti, 1 ora, 2 ore, default 15) e “La sera prima alle” (default 20:00).

Attività: “La sera prima alle” e “Il giorno della scadenza alle” (default 08:00).

Due pillole azzurre:

- Aggiungi gli impegni a Calendario: file ICS degli impegni e delle scadenze future.
- Rimuovi gli impegni da Calendario. Conferma, titolo esatto: “Togliere gli impegni dal Calendario del telefono?” Testo: “Toglie gli impegni che questa agenda aveva aggiunto. Quelli scritti a mano sul telefono restano.” Poi un file ICS di annullamento.

Privacy: informativa in italiano (account, dati dell’agenda, alunni, file, lettura documenti, notifiche, cosa non facciamo). In fondo il pulsante con il cestino **nella stessa riga** del testo: “Elimina tutti i miei dati”. Il pulsante è una pillola rosso chiaro. Poi conferma: “Confermi? Elimina tutto, senza ritorno” (pillola rossa) e Annulla (pillola azzurra). Cancella l’agenda di quell’account e i file, e torna a una scuola vuota “La mia scuola”.

## 12. Dati e due dispositivi

Tutto è in italiano. Date scritte “9 settembre”, non in formato americano. Voti con la virgola.

Oggetti, ciascuno con un id: scuole, ore, colori di classe e materia, lezioni dell’orario, impegni, schede lezione, attività, classi, alunni, voti, annotazioni alunno, assenze, note, contatti, link, archivio, preferenze (tema, promemoria, ultima scuola, tab aperti).

Salvataggio sull’account. Se telefono e computer salvano in momenti diversi:

- un elemento aggiunto solo da una parte resta
- un campo modificato solo da una parte resta
- se le due parti cambiano due campi diversi dello stesso elemento, restano entrambi
- una cancellazione resta solo se l’altra parte non ha modificato quell’elemento
- se tutte e due cambiano lo stesso campo, resta l’ultima modifica di quel campo, non si riscrive il resto

Non è in diretta: l’altro schermo vede le novità quando riapre l’app o quando salva qualcosa. Allora compare: “Ho unito le modifiche dell’altro dispositivo con le tue.”

All’uscita i dati restano sull’account. Un altro account, anche sullo stesso telefono, vede la propria agenda vuota, non la precedente.

## 13. Cose da non fare, se la ricostruisci

- Non chiamarla Grok App.
- Non mettere il logout in alto a destra: sta in Impostazioni, ultima riga.
- Non aprire i moduli PDF in una finestra piccola dentro l’app.
- Non sostituire la lista classi del calendario lezioni con un menu sempre visibile: il menu c’è solo prima di entrare nella classe, per l’esportazione.
- Non mettere due linee sotto Aspetto.
- Non allineare nome ed email sotto il cerchio: stanno di fianco.
- Non mostrare i dati di esempio come se fossero dell’utente, dopo il login reale l’agenda parte vuota o con i suoi dati.
- Lingua dell’interfaccia: italiano, tono diretto, niente inglese nei pulsanti.

## Come è fatto questo file

Un solo file HTML. Aprilo nel browser: è l’app. I dati restano su questo dispositivo.

Per rifarla uguale segui le sezioni 1–13. L’aspetto è nel blocco `<style>`, le schermate e le funzioni sono nello script `engine`. Non aggiungere sezioni. Non tradurre in inglese. Nome visibile: Agenda docente.

Novità di questa copia: nessun login. Avvio diretto su Oggi. Salvataggio locale. Il codice di recupero è solo locale. La lettura dei documenti resta sul dispositivo, senza invio a un servizio esterno.

function toMin(t){var m=/^(\d{1,2})[:.](\d{2})$/.exec(String(t||''));return m?Number(m[1])*60+Number(m[2]):null}
function markNow(){
  var g=document.querySelector('.grid');
  var old=document.querySelectorAll('.grid .now');
  for(var i=0;i<old.length;i++){old[i].classList.remove('now');old[i].removeAttribute('aria-current')}
  if(!g||state.school==='all')return;
  var d=new Date(),day=d.getDay(),nm=d.getHours()*60+d.getMinutes();
  var hrs=hoursOf(state.school),slot=0;
  for(var k=0;k<hrs.length;k++){
    var s=toMin(hrs[k].start),e=toMin(hrs[k].end);
    if(s===null)continue;
    if(e===null||e<=s)e=s+60;
    if(nm>=s&&nm<e){slot=k+1;break}
  }
  function set(sel,val){var els=g.querySelectorAll(sel);for(var j=0;j<els.length;j++){els[j].classList.add('now');els[j].setAttribute('aria-current',val)}}
  var gh=(day>=1&&day<=6)?g.querySelectorAll('.gh[data-day="'+day+'"]'):[];
  if(!gh.length)return;
  set('.gh[data-day="'+day+'"]','date');
  if(!slot)return;
  set('.gl[data-hr="'+slot+'"]','time');
  set('[data-slot="'+day+'-'+slot+'"]','time');
}

}

function buildIcs(){
  var c=state.remind,it=remindItems(),now=Date.now();
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda docente//IT','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  var eveBefore=function(d,hm,at){return Math.round((atTime(d,hm)-atTime(d,at,-1))/60000)};
  it.evs.forEach(function(e){
    var st=atTime(e.date,e.start||'00:00');
    L.push('BEGIN:VEVENT','UID:'+e.id+'@agenda-docente','DTSTAMP:'+stamp);
    if(e.start){
      var en=e.end?atTime(e.date,e.end):new Date(st.getTime()+36e5);
      L.push('DTSTART:'+icsDT(e.date,e.start),'DTEND:'+iso(en).replace(/-/g,'')+'T'+pad(en.getHours())+pad(en.getMinutes())+'00');
    }else{
      L.push('DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+iso(atTime(e.date,'00:00',1)).replace(/-/g,''));
    }
    L.push('SUMMARY:'+icsEsc(e.title));
    if(e.place)L.push('LOCATION:'+icsEsc(e.place));
    var ds=[TIPI[e.type]||'',e.notes||''].filter(Boolean).join('\n');
    if(ds)L.push('DESCRIPTION:'+icsEsc(ds));
    var m=Number(c.evMin)||0;
    if(m>0&&e.start&&st.getTime()-m*6e4>now)L.push.apply(L,icsAlarm('-PT'+m+'M',e.title+' tra '+m+' minuti'));
    if(c.evEve){var b=eveBefore(e.date,e.start||'00:00',c.evEveTime);if(st.getTime()-b*6e4>now)L.push.apply(L,icsAlarm('-PT'+b+'M','Domani: '+e.title+(e.start?' alle '+e.start:'')))}
    L.push('END:VEVENT');
  });
  it.tks.forEach(function(t){
    var d0=atTime(t.due,'00:00');
    L.push('BEGIN:VEVENT','UID:'+t.id+'@agenda-docente-attivita','DTSTAMP:'+stamp,
      'DTSTART;VALUE=DATE:'+t.due.replace(/-/g,''),'DTEND;VALUE=DATE:'+iso(atTime(t.due,'00:00',1)).replace(/-/g,''),
      'SUMMARY:'+icsEsc('Scadenza: '+t.title+(t.cls?' ('+t.cls+')':'')));

    if(c.tkMorn){var q=(c.tkMornTime||'08:00').split(':').map(Number),mm=q[0]*60+q[1];if(d0.getTime()+mm*6e4>now)L.push.apply(L,icsAlarm('PT'+mm+'M','Oggi scade: '+t.title))}
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}

function attendHTML(s,c){
  var h='<h2>Presenze e assenze</h2>';
  var emptyMsg='<p class="m empty softempty">Ancora nessuna lezione svolta con una scheda lezione.</p>';
  if(!c)return h+emptyMsg;
  var L=Object.assign({},state.absLog||{}),list=clsSubjList(c),prim=list[0]||'';
  var tdy=absToday(),td0=state.dayAbs&&state.dayAbs.date;
  if(td0&&tdy[s.id]&&!(L[td0]&&L[td0][s.id])){L[td0]=Object.assign({},L[td0]||{});L[td0][s.id]=1}
  var logs=state.logs.filter(function(g){return g.school===c.school&&g.cls===c.name});
  var groups=list.length?list:[''];
  function sOf(g){return list.length?(g.subject||prim):''}
  var byDate={};logs.forEach(function(g){(byDate[g.date]=byDate[g.date]||[]).push(g)});
  var absBy={};
  Object.keys(L).forEach(function(d){
    var v=L[d][s.id];if(!v)return;
    var targets;
    if(typeof v==='string')targets=[list.length?(list.indexOf(v)>=0?v:prim):''];
    else{var m={};(byDate[d]||[]).forEach(function(g){m[sOf(g)]=1});targets=Object.keys(m);if(!targets.length)targets=[prim]}
    targets.forEach(function(t){(absBy[t]=absBy[t]||{})[d]=1});
  });
  var cards=groups.map(function(sj){
    var ls=logs.filter(function(g){return sOf(g)===sj}),ad=absBy[sj]||{},ld={};
    ls.forEach(function(g){ld[g.date]=1});
    var rd={};(state.rolls||[]).forEach(function(x){if(x.cls===c.id&&(list.length?(x.subject||prim):'')===sj)rd[x.date]=1});var exS={};Object.keys(ad).forEach(function(d){if(!ld[d])exS[d]=1});Object.keys(rd).forEach(function(d){if(!ld[d])exS[d]=1});var extra=Object.keys(exS).length,exAb=Object.keys(ad).filter(function(d){return !ld[d]}).length;
    var total=ls.length+extra;if(!total)return '';
    var ab=ls.filter(function(g){return ad[g.date]}).length+exAb,pr=total-ab,pc=Math.round(pr/total*100);
    return '<div class="rowbtn mid" style="cursor:default"><span class="grow"><span class="t">'+esc(sj||'Lezioni')+'</span><span class="m">'+total+(total===1?' lezione: ':' lezioni: ')+pr+(pr===1?' presenza, ':' presenze, ')+ab+(ab===1?' assenza':' assenze')+'</span></span><span class="chip'+(pc<75?' red':'')+'">'+pc+'%</span></div>';
  }).join('');
  if(!cards)return h+emptyMsg;
  return h+'<div class="calcards" style="margin-top:8px">'+cards+'</div>';
}

    if(drop<0)drop=0;
    if(isStandalone()&&vv.scale<=1.02)drop=0;
  }

function bindWeek(){
  var sc=document.getElementById('weekscroller');
  if(!sc)return;
  var on=sc.querySelector('button.on')||sc.querySelector('button.oggi');
  if(on&&on.parentNode){
    var wk=on.parentNode;
    sc.scrollLeft+=wk.getBoundingClientRect().left-sc.getBoundingClientRect().left;
  }
  var timer,user=false;
  function mark(){user=true}
  ['touchstart','pointerdown','mousedown','wheel','keydown'].forEach(function(ev){sc.addEventListener(ev,mark,{passive:true})});
  sc.addEventListener('scroll', function(){
    if(!user)return;
    clearTimeout(timer);
    timer=setTimeout(function(){
      user=false;
      var weeks=sc.querySelectorAll('.week');
      var left=sc.getBoundingClientRect().left,best=null,bd=1e9;
      for(var i=0;i<weeks.length;i++){
        var d=Math.abs(weeks[i].getBoundingClientRect().left-left);
        if(d<bd){bd=d;best=weeks[i]}

      if(!best)return;
      var wkey=sc.dataset.key||'oggi';var cur=ui()[wkey]||iso(new Date());

      var btn=best.querySelector('[data-dow="'+dow+'"]')||best.querySelector('button');
      if(btn&&btn.dataset.date!==cur){ui()[wkey]=btn.dataset.date;render()}
    }, 160);
  }, {passive:true});
}

function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function makeGroups(students,mode,num,size,balance){
  var arr=shuffleArr(students.slice());
  var n;
  if(mode==='squadre')n=Math.max(2,Math.min(num,arr.length||2));
  else n=Math.max(1,Math.ceil(arr.length/Math.max(2,size)));
  var groups=[];for(var i=0;i<n;i++)groups.push([]);var off=0;if(balance){var bm=arr.filter(function(s){return s.sex==='M'}),bf=arr.filter(function(s){return s.sex==='F'}),bo=arr.filter(function(s){return s.sex!=='M'&&s.sex!=='F'});if(bm.length&&bf.length){arr=bm.concat(bf).concat(bo);off=Math.floor(Math.random()*n)}}
  arr.forEach(function(s,i){groups[(i+off)%n].push(s)});
  return groups;
}

/* ---------- timer e cronometro ---------- */
function fmtMs(ms){
  ms=Math.max(0,ms);var s=Math.floor(ms/1000);var m=Math.floor(s/60);s=s%60;
  return pad(Math.min(m,99))+':'+pad(s);
}
function openTimerTool(){
  sheet={kind:'timer',mode:'countdown',running:false,elapsed:0,startAt:0,targetMs:5*60000,tickHandle:null,done:false};
  renderTimer();
}
function timerNow(){return sheet.elapsed+(sheet.running?Date.now()-sheet.startAt:0)}
function renderTimer(){
  var disp=sheet.mode==='countdown'?fmtMs(sheet.targetMs-timerNow()):fmtMs(timerNow());
  var again=!!document.querySelector('#sheet .sheet[aria-label="Timer e cronometro"]');
  var h='<div class="ov" id="ov"><div class="sheet"'+(again?' style="animation:none"':'')+' role="dialog" aria-modal="true" aria-label="Timer e cronometro"><h2>Timer e cronometro</h2>';
  h+='<div class="tabs" role="group" aria-label="Modalità"><button class="tab" data-act="tmmode" data-mode="countdown" aria-pressed="'+(sheet.mode==='countdown')+'">Timer</button><button class="tab" data-act="tmmode" data-mode="stopwatch" aria-pressed="'+(sheet.mode==='stopwatch')+'">Cronometro</button></div>';
  if(sheet.mode==='countdown'&&!sheet.running&&!sheet.done){
    h+='<p class="m" style="margin:14px 0 4px">Durata</p><div class="sbtns">'+[1,3,5,10,15,20].map(function(m){return '<button class="btn ghost small" data-act="tmpreset" data-min="'+m+'" aria-pressed="'+(sheet.targetMs===m*60000)+'">'+m+' min</button>'}).join('')+'</div>';
  }
  h+='<p id="tmdisp" style="text-align:center;font:600 56px/1.2 var(--font-head);margin:20px 0;font-variant-numeric:tabular-nums">'+disp+'</p>';
  if(sheet.done)h+='<p class="m" style="text-align:center;color:var(--red);font-weight:700;margin:-10px 0 14px">Tempo scaduto</p>';
  h+='<div class="sbtns" style="justify-content:center">';
  h+=sheet.running?'<button class="btn" data-act="tmpause">'+ic('pause',18)+' Pausa</button>':'<button class="btn" data-act="tmstart">'+ic('play',18)+' '+((sheet.elapsed>0&&!sheet.done)?'Riprendi':'Avvia')+'</button>';
  h+='<button class="btn ghost" data-act="tmreset">Azzera</button></div>';
  h+='<div class="sbtns"><button class="btn ghost" data-act="close">Chiudi</button></div>';
  h+='</div></div>';
  document.getElementById('sheet').innerHTML=h;
  document.body.style.overflow='hidden';
  timerTick();
}
function timerTick(){
  var el=document.getElementById('tmdisp');if(!el)return;
  if(sheet.mode==='countdown'){
    var left=sheet.targetMs-timerNow();
    el.textContent=fmtMs(left);
    if(sheet.running&&left<=0){
      sheet.running=false;sheet.done=true;sheet.elapsed=sheet.targetMs;
      if(sheet.tickHandle){clearInterval(sheet.tickHandle);sheet.tickHandle=null}
      if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}
      renderTimer();return;
    }
  }else{
    el.textContent=fmtMs(timerNow());
  }
}
function timerStart(){
  if(sheet.done)sheet.elapsed=0;
  sheet.done=false;sheet.running=true;sheet.startAt=Date.now();
  if(sheet.tickHandle)clearInterval(sheet.tickHandle);
  sheet.tickHandle=setInterval(timerTick,250);
  renderTimer();
}
function timerPause(){
  sheet.elapsed=timerNow();sheet.running=false;
  if(sheet.tickHandle){clearInterval(sheet.tickHandle);sheet.tickHandle=null}
  renderTimer();
}
function timerReset(){
  if(sheet.tickHandle){clearInterval(sheet.tickHandle);sheet.tickHandle=null}
  sheet.running=false;sheet.elapsed=0;sheet.done=false;
  renderTimer();
}

function normLine(l){
  l=l.replace(/\bdalle(?:\s+ore)?\s+(\d{1,2})(?:[:.,](\d{2}))?\s+alle(?:\s+ore)?\s+(\d{1,2})(?:[:.,](\d{2}))?/gi,function(m,a,b,c,d){return 'ore '+pad(a)+':'+(b||'00')+'-'+pad(c)+':'+(d||'00')});
  l=l.replace(/\bh\.\s*(?=\d)/gi,'ore ');
  l=l.replace(new RegExp('(^|[^\\d])(\\d{1,2})\\s*[-–]\\s*(\\d{1,2})\\s+('+MRE+')(?![a-zà-ù])','gi'),function(m,pre,a,b,mon){a=Number(a);b=Number(b);if(a<1||b<=a||b>31)return m;return pre+'dal '+a+' al '+b+' '+mon});
  l=l.replace(new RegExp('(^|[^\\d:.,\\/])(\\d{1,2}\\s*[°º]?(?:\\s*(?:,|e|ed)\\s*\\d{1,2}\\s*[°º]?)+)\\s+('+MRE+')(?![a-zà-ù])','gi'),function(m,pre,list,mon){
    var nums=list.match(/\d{1,2}/g);
    if(!nums||nums.some(function(n){n=Number(n);return n<1||n>31}))return m;
    return pre+nums.map(function(n){return Number(n)+' '+mon}).join(' e ');
  });
  return l;
}
function dayLead(line){
  var m=RE_DAYLEAD.exec(line);if(!m)return null;
  var wd=m[1]||m[3];
  var rest=line.slice(m[0].length);
  if(!wd&&!/^\s*[-–:]\s*\S/.test(rest))return null;
  var day=Number(m[2]);if(day<1||day>31)return null;
  return {day:day,wd:wd?WD3.indexOf(wd.slice(0,3).toLowerCase()):-1,rest:rest};
}
function ctxDate(c,dl,S){
  var y=c.y||(c.mo>=8?S:S+1);
  var dt=new Date(y,c.mo,dl.day);
  if(dt.getMonth()!==c.mo)return null;
  return {date:iso(dt),warn:dl.wd>=0&&dt.getDay()!==dl.wd};
}
function extractEvents(text){
  var S=schoolStart(text);
  var lines=text.split(/\r?\n/).map(function(l){return normLine(l.replace(/\s+/g,' ').trim())});
  var found=[],plain=[],dateLine=[],ctx=null;
  lines.forEach(function(line,li){
    if(line.length<3)return;
    var hm=RE_HEAD.exec(line);
    if(hm){ctx={mo:mIdx(hm[1]),y:hm[2]?Number(hm[2]):0};plain[li]='';return}
    if(SKIP_DATE_LINE.test(line)){plain[li]=cleanTitle(line);return}
    var w=line,hits=[];
    w=w.replace(RE_RANGE,function(m,pre,d1,m1,d2,m2,yy){
      var mo2=mIdx(m2),mo1=m1?mIdx(m1):mo2;
      var y2=yy?Number(yy):(mo2>=8?S:S+1);
      var y1=yy?(mo1>mo2?y2-1:y2):(mo1>=8?S:S+1);
      var s=ymd(y1,mo1,Number(d1));
      if(!s||!ymd(y2,mo2,Number(d2)))return m;
      hits.push({date:s,note:m.slice(pre.length).trim()});
      return pre+new Array(m.length-pre.length+1).join(' ');
    });
    w=w.replace(RE_NUM,function(m,pre,d,sep,mo,yy){
      if(!yy&&sep!=='/')return m;
      if(yy&&yy.length===3)return m;
      var mi=Number(mo)-1;
      var y=yy?(yy.length===2?2000+Number(yy):Number(yy)):(mi>=8?S:S+1);
      var s=ymd(y,mi,Number(d));
      if(!s)return m;
      hits.push({date:s,note:''});
      return pre+new Array(m.length-pre.length+1).join(' ');
    });
    w=w.replace(RE_TXT,function(m,pre,d,mon,yy){
      var mi=mIdx(mon);
      var y=yy?Number(yy):(mi>=8?S:S+1);
      var s=ymd(y,mi,Number(d));
      if(!s)return m;
      hits.push({date:s,note:''});
      return pre+new Array(m.length-pre.length+1).join(' ');
    });
    if(!hits.length&&ctx){
      var dl=dayLead(w);
      if(dl){
        var cd=ctxDate(ctx,dl,S);
        if(cd){hits.push({date:cd.date,note:cd.warn?'Il giorno della settimana non coincide con la data: controlla.':''});w=dl.rest}
      }
    }
    if(!hits.length){plain[li]=cleanTitle(w);return}
    dateLine[li]=1;
    var tt=cleanTitle(w);
    var tm=findTime(w);
    if(tm.start)tt=cleanTitle(w.replace(/(^|[^\d.,:\/])(\d{1,2})[.,](\d{2})(?:\s*[-–]\s*(\d{1,2})[.,](\d{2}))?(?![\d.,])/g,function(m,pre,h,mi){return tmv(h,mi)?pre+' ':m}));
    hits.forEach(function(h){found.push({li:li,date:h.date,title:tt,start:tm.start,end:tm.end,note:h.note})});
  });
  found.forEach(function(f){
    if(f.title.length<3){
      var t='',j;
      for(j=f.li+1;j<lines.length&&j<f.li+6;j++){
        if(dateLine[j])break;
        var pl=lines[j];
        if(pl===undefined)continue;
        if(WEEKDAYS.test(pl))continue;
        if(slotAt(pl))break;
        if(/^[-•●\u2022]/.test(pl))break;
        if(plain[j]&&plain[j].length>=1){t=(t?t+' ':'')+plain[j];if(t.length>60)break}
      }
      if(t){f.title=cleanTitle(t);f.guess=true}else f.title=f.title||'Impegno';
    }
    var slots=[],k;
    for(k=f.li+1;k<lines.length;k++){
      if(dateLine[k])break;
      var pl2=lines[k];if(pl2===undefined)continue;
      var sl=findTime(pl2);if(sl.start)slots.push(sl);
    }
    if(!f.start&&slots.length){
      f.start=slots[0].start;
      var ends0=slots.map(function(x){return x.end||x.start}).filter(Boolean);
      f.end=ends0.length?ends0[ends0.length-1]:'';
      if(f.end<=f.start)f.end='';
      f.tguess=true;
    }else if(f.start&&slots.length){
      var ends1=slots.map(function(x){return x.end||x.start}).filter(Boolean).filter(function(e){return e>(f.end||f.start)});
      if(ends1.length)f.end=ends1[ends1.length-1];
    }
    if(slots.length>1)f.note=(f.note?f.note+'; ':'')+'Più orari nel documento originale: controlla i dettagli.';
  });
  var seen={};
  return found.filter(function(f){
    var y=Number(f.date.slice(0,4));
    if(y<S-1||y>S+2)return false;
    var k=f.date+'|'+f.title.toLowerCase();
    if(seen[k])return false;seen[k]=1;return true;
  }).map(function(f){f.type=guessType(f.title);return f})
    .sort(function(a,b){return a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||'')});
}

var IDB_NAME='agenda-docente-files',IDB_STORE='files';
function idbOpen(){
  return new Promise(function(res,rej){
    if(!('indexedDB' in window)){rej(new Error('no-idb'));return}
    var rq=indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore(IDB_STORE)};
    rq.onsuccess=function(){res(rq.result)};
    rq.onerror=function(){rej(rq.error)};
  });
}
function idbPut(id,blob){return idbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(blob,id);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
function idbGet(id){return idbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readonly');var rq=tx.objectStore(IDB_STORE).get(id);rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){rej(rq.error)}})})}
function idbDel(id){return idbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(id);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})}).catch(function(){})}

function fileMime(it,blob){
  var m=(blob&&blob.type)||(it&&it.mime)||'';
  if(m&&m!=='application/octet-stream')return m;
  var n=((it&&(it.filename||it.name))||'').toLowerCase();
  if(/\.pdf$/.test(n))return 'application/pdf';
  if(/\.png$/.test(n))return 'image/png';
  if(/\.jpe?g$/.test(n))return 'image/jpeg';
  if(/\.docx$/.test(n))return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  if(/\.doc$/.test(n))return 'application/msword';
  return m||'application/octet-stream';
}
function fileNameWithExt(name,mime){
  var n=name||'file';
  if(/\.[a-z0-9]{2,5}$/i.test(n))return n;
  if(mime==='application/pdf')return n+'.pdf';
  if(mime==='image/png')return n+'.png';
  if(mime==='image/jpeg')return n+'.jpg';
  if(mime.indexOf('wordprocessingml')>-1)return n+'.docx';
  if(mime==='application/msword')return n+'.doc';
  return n;
}

function labelHour(lab){
  lab=String(lab==null?'':lab).trim();
  var m=lab.match(/^(\d{1,2})\s*[ªº°^]?(?:\s*ora)?$/i);
  if(m)return Number(m[1]);
  if(/^\d{1,2}[:.]\d{2}(?:\s*[-–]\s*\d{1,2}[:.]\d{2})?$/.test(lab))return -1;
  return 0;
}
function gridFromRows(rows){
  var hi=-1,cols={};
  for(var i=0;i<rows.length;i++){
    var map={},cnt=0;
    rows[i].forEach(function(c,j){var t=String(c).trim();if(DAY_RE.test(t)){map[j]=dayNum(t);cnt++}});
    if(cnt>=3){hi=i;cols=map;break}
  }
  if(hi<0)return null;
  var cells=[],ign=0,rank=0;
  for(i=hi+1;i<rows.length;i++){
    var r=rows[i],h=labelHour(r[0]);
    if(!h)continue;
    if(h===-1)h=++rank;
    if(h>maxHour()){ign++;continue}
    Object.keys(cols).forEach(function(j){cells.push({day:cols[j],hour:h,text:r[j]})});
  }
  return {cells:cells,ignored:ign};
}
function gridFromItems(items){
  var days=items.filter(function(it){return DAY_RE.test(it.s)});
  if(days.length<3)return null;
  var best=null;
  days.forEach(function(d){
    var g=days.filter(function(e){return Math.abs(e.y-d.y)<=4});
    var set={};g.forEach(function(e){set[dayNum(e.s)]=1});
    var c=Object.keys(set).length;
    if(!best||c>best.c)best={c:c,g:g,y:d.y};
  });
  if(!best||best.c<3)return null;
  var colsMap={};
  best.g.forEach(function(e){colsMap[dayNum(e.s)]={n:dayNum(e.s),cx:e.x+e.w/2}});
  var cl=Object.keys(colsMap).map(function(k){return colsMap[k]}).sort(function(a,b){return a.cx-b.cx});
  var gap=cl.length>1?(cl[1].cx-cl[0].cx):80;
  cl.forEach(function(c,i){c.lo=i?(cl[i-1].cx+c.cx)/2:-1e9;c.hi=i<cl.length-1?(c.cx+cl[i+1].cx)/2:1e9});
  var leftEdge=cl[0].cx-gap/2;
  var labs=[];
  items.forEach(function(it){
    if(it.y>=best.y-3)return;
    if(it.x+it.w/2>=leftEdge)return;
    var h=labelHour(it.s);
    if(!h)return;
    var dup=labs.filter(function(l){return Math.abs(l.y-it.y)<=4})[0];
    if(dup){if(dup.h===-1&&h>0)dup.h=h;return}
    labs.push({y:it.y,h:h});
  });
  if(!labs.length)return null;
  labs.sort(function(a,b){return b.y-a.y});
  var rank=0;
  labs.forEach(function(l){if(l.h===-1)l.h=++rank});
  var rowH=labs.length>1?Math.abs(labs[0].y-labs[1].y):40;
  labs.forEach(function(l,i){
    l.top=i?(labs[i-1].y+l.y)/2:Math.min(best.y-3,l.y+rowH/2);
    l.bot=i<labs.length-1?(l.y+labs[i+1].y)/2:l.y-rowH/2;
  });
  var cells=[],ign=0;
  labs.forEach(function(l){
    if(l.h>maxHour()){ign++;return}
    cl.forEach(function(c){
      var part=items.filter(function(it){
        var cx=it.x+it.w/2;
        return cx>=leftEdge&&cx>=c.lo&&cx<c.hi&&it.y<=l.top&&it.y>l.bot;
      }).sort(function(a,b){return b.y-a.y||a.x-b.x});
      cells.push({day:c.n,hour:l.h,text:part.map(function(q){return q.s}).join(' ')});
    });
  });
  return {cells:cells,ignored:ign};
}
function parseCell(t){
  t=String(t==null?'':t).replace(/\s+/g,' ').trim();
  if(!t||/^[-–—.\/\s]+$/.test(t))return [];
  var room='';
  t=t.replace(/\b(?:aula|lab(?:oratorio)?\.?|palestra)\s*([A-Za-z0-9]{0,6})/i,function(m){room=m.trim();return ' '});
  var cls=[],m,re=/(^|[^0-9A-Za-zÀ-ÿ])([1-5])\s?[ªº°^]?\s?([A-Za-z])(?![A-Za-zÀ-ÿ])/g;
  while((m=re.exec(t)))cls.push(m[2]+m[3].toUpperCase());
  if(!cls.length)return [];
  var rest=t.replace(re,' ').replace(/[\/\-–,;:()]+/g,' ').replace(/\s+/g,' ').trim();
  if(rest&&rest===rest.toUpperCase())rest=rest.toLowerCase();
  rest=rest?rest.charAt(0).toUpperCase()+rest.slice(1):'Lezione';
  return cls.map(function(c){return {cls:c,subject:rest.slice(0,40),room:room}});
}
function orarioFromLines(lines){

    if(!m)return;
    var hour=Number(m[2]);if(hour<1||hour>maxHour())return;
    parseCell(m[3]).forEach(function(e){out.push({giorno:dayNum(m[1]),ora:hour,classe:e.cls,materia:e.subject,aula:e.room})});
  });
  return out;
}
function orarioFromCsv(rows){
  var hi=-1,ix={};
  for(var i=0;i<rows.length;i++){
    var low=rows[i].map(function(c){return String(c).toLowerCase()});
    if(low.indexOf('giorno')>-1&&low.indexOf('classe')>-1){hi=i;ix={g:low.indexOf('giorno'),o:low.indexOf('ora'),c:low.indexOf('classe'),m:low.indexOf('materia'),a:low.indexOf('aula')};break}
  }
  if(hi<0||ix.o<0)return [];
  var out=[];
  rows.slice(hi+1).forEach(function(r){
    var day=dayNum(r[ix.g]),hour=Number(String(r[ix.o]).replace(/\D/g,''));
    if(!day||hour<1||hour>maxHour())return;
    var cell=parseCell(String(r[ix.c]||'')+' '+(ix.m>-1?r[ix.m]||'':''));
    var room=ix.a>-1?String(r[ix.a]||'').trim():'';
    cell.forEach(function(e){out.push({giorno:day,ora:hour,classe:e.cls,materia:e.subject,aula:room||e.room})});
  });

}
async function localOrario(file){

var NOISE_RE=/\b(elenco|alunni|alunno|alunne|anno|scolastico|a\.s\.|registro|docente|pagina|data|nato|nata|cognome|nome|firma|scuola|istituto|coordinatore|sezione|totale|maschi|femmine|class[ei]?)\b/i;
var PART_RE=/^(de|di|da|del|della|dello|dei|degli|delle|dal|dalla|dai|lo|la|le|li|van|von|mc|mac|d['’]|l['’])$/i;
function splitName(toks,mode){
  if(toks.length===1)return {sur:toks[0],first:''};
  var k;
  if(mode==='nameFirst'){
    k=toks.length-1;var sur=[toks[k]];
    while(k>1&&PART_RE.test(toks[k-1])){sur.unshift(toks[k-1]);k--}
    return {sur:sur.join(' '),first:toks.slice(0,k).join(' ')};
  }
  var caps=0;
  while(caps<toks.length&&/[A-Za-zÀ-ÿ]/.test(toks[caps])&&toks[caps]===toks[caps].toUpperCase())caps++;
  if(caps>0&&caps<toks.length)return {sur:toks.slice(0,caps).join(' '),first:toks.slice(caps).join(' ')};
  var last=toks[toks.length-1];
  if(/^[A-Za-zÀ-ÿ]\.$/.test(last))return {sur:toks.slice(0,-1).join(' '),first:last.replace('.','')};
  k=1;
  if(PART_RE.test(toks[0])&&toks.length>2)k=2;
  return {sur:toks.slice(0,k).join(' '),first:toks.slice(k).join(' ')};

function readDataUrl(file){

async function fileToImage(file){

  var img=await new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){rej(new Error('img'))};i.src=url});

  var cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);

async function pdfToImages(file,maxPages){
  var buf=await file.arrayBuffer();

  await loadScript(LIBS.pdf);

  lib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker;

}

async function runOcr(id){
  var it=state.archive.filter(function(x){return x.id===id})[0];if(!it)return;
  sheet={kind:'ocr',id:id,text:it.ocrText||'',busy:true,msg:'Sto leggendo il testo della foto. Alla prima volta può richiedere una quindicina di secondi.'};
  renderOcr();
  try{
    var blob=await idbGet(id);
    if(!blob)throw new Error('nofile');
    await loadScript(LIBS.tesseract);
    var res=await window.Tesseract.recognize(blob,'ita');
    var txt=(res&&res.data&&res.data.text||'').trim();
    if(!sheet||sheet.kind!=='ocr'||sheet.id!==id)return;
    sheet.busy=false;sheet.text=txt;sheet.msg=txt?'':'Non sono riuscito a leggere del testo in questa foto. Prova con una foto più nitida e ben illuminata.';
    it.ocrText=txt;save();
  }catch(err){
    if(!sheet||sheet.kind!=='ocr')return;
    sheet.busy=false;sheet.msg='Non sono riuscito a leggere la foto. Controlla la connessione e riprova.';
  }
  renderOcr();
}
function renderOcr(){
  var h='<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Testo dalla foto"><h2>Testo dalla foto</h2>';

var loaded={};
function loadScript(src){
  if(loaded[src])return loaded[src];
  loaded[src]=new Promise(function(res,rej){
    var s=document.createElement('script');s.src=src;s.onload=res;
    s.onerror=function(){delete loaded[src];rej(new Error('load'))};
    document.head.appendChild(s);
  });
  return loaded[src];
}
async function pdfText(buf){
  await loadScript(LIBS.pdfWorker);
  await loadScript(LIBS.pdf);
  var lib=window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker;
  var doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;
  var out='';
  for(var p=1;p<=doc.numPages;p++){
    var pg=await doc.getPage(p);var tc=await pg.getTextContent();
    var its=tc.items.filter(function(it){return it.str&&it.str.trim()}).map(function(it){
      return {s:it.str,x:it.transform?it.transform[4]:0,y:it.transform?it.transform[5]:0};
    });
    its.sort(function(a,b){return b.y-a.y||a.x-b.x});
    var rows=[];
    its.forEach(function(it){
      var r=rows[rows.length-1];
      if(r&&Math.abs(r.y-it.y)<=3)r.items.push(it);else rows.push({y:it.y,items:[it]});
    });
    rows.forEach(function(r){
      r.items.sort(function(a,b){return a.x-b.x});
      out+=r.items.map(function(i){return i.s}).join(' ')+'\n';
    });
  }
  return out;
}

async function aiExtract(text){
  try{
    if(!opts.aiExtract)return null;
    var y=schoolStart(text);
    var data=await opts.aiExtract(text.slice(0,15000), y+'/'+(y+1));
    if(!data||!data.length)return null;
    return data.map(function(e){
      var d=String(e.date||'');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;
      return {date:d,title:String(e.title||'Impegno').slice(0,90),start:/^\d{2}:\d{2}$/.test(e.start)?e.start:'',end:/^\d{2}:\d{2}$/.test(e.end)?e.end:'',type:TIPI[e.type]?e.type:'altro',note:''};
    }).filter(Boolean);
  }catch(err){return null}
}
async function handleFile(f,input){
  setStatus('Sto leggendo «'+f.name+'»…',false);
  try{
    if(f.size>15*1024*1024){setStatus('Il file supera i 15 MB. Prova con uno più leggero.',true);return}
    var ext=(f.name.split('.').pop()||'').toLowerCase();var text;
    if(['pdf','docx','txt','csv','doc'].indexOf(ext)<0){
      var ty=(f.type||'').toLowerCase();
      if(ty==='application/pdf')ext='pdf';
      else if(ty.indexOf('wordprocessingml')>-1)ext='docx';
      else if(ty==='text/plain')ext='txt';
      else if(ty==='text/csv'||ty==='text/comma-separated-values')ext='csv';
    }
    if(ext==='pdf')text=await pdfText(await f.arrayBuffer());
    else if(ext==='docx')text=await docxText(await f.arrayBuffer());
    else if(ext==='txt'||ext==='csv')text=await f.text();
    else if(ext==='doc'){setStatus('I file .doc vecchi non si leggono. Salvalo come .docx o PDF e riprova.',true);return}
    else{setStatus('Questo tipo di file non si legge ancora in automatico. Per ora funzionano PDF, Word (.docx), testo e CSV.',true);return}
    if(text.replace(/\s/g,'').length<20){setStatus('Non trovo testo da leggere. Se è una scansione o una foto, non riesco a leggerla.',true);return}
    var found=await aiExtract(text);
    var viaAI=!!found;
    if(!found)found=extractEvents(text);
    if(!found.length){setStatus('Non ho trovato date in questo file.',true);return}
    setStatus('',false);
    openReview(f.name,found,viaAI);
  }catch(err){
    setStatus('Non sono riuscito a leggere il file. Controlla la connessione e riprova.',true);
  }finally{
    if(input)input.value='';
  }
}

/* ---------- revisione delle date trovate ---------- */
function openReview(name,found,viaAI){
  sheet={kind:'review',found:found,name:name};
  var h='<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Impegni trovati"><h2>Impegni trovati</h2><p class="m" style="margin:0 0 6px">'+(viaAI?'Letto con l\'aiuto dell\'IA. ':'')+'Ho trovato '+found.length+(found.length===1?' data':' date')+' in «'+esc(name)+'». Controlla i titoli e togli la spunta a quelle che non ti servono.'+(state.schools.length>1?' Verranno aggiunte a: '+esc(schoolName(defSchool()))+'.':'')+'</p>';
  h+='<div class="sbtns" style="margin:8px 0 4px"><button class="btn ghost small" data-act="rvall">Deseleziona tutte</button></div>';
  h+=found.map(function(f,i){
    var d=parse(f.date);
    var hint=(f.guess?'Titolo dedotto dalle righe vicine. ':'')+(f.tguess?'Orario dedotto dalle righe vicine. ':'');
    return '<div class="rv"><input class="chk rvc" type="checkbox" data-i="'+i+'" checked aria-label="Includi"><div class="grow"><input class="rvd" type="date" value="'+esc(f.date)+'" aria-label="Data"><input class="rvt" type="text" value="'+esc(f.title)+'" aria-label="Titolo"><div class="rvtm"><label>Inizio<input class="rvs" type="time" value="'+esc(f.start)+'"></label><label>Fine<input class="rve" type="time" value="'+esc(f.end)+'"></label></div>'+(hint?'<span class="m">'+hint+'Controlla.</span>':'')+'</div></div>';
  }).join('');
  h+='<div class="sbtns"><button class="btn" id="rvadd" data-act="rvok">Aggiungi '+found.length+(found.length===1?' impegno':' impegni')+' al calendario</button><button class="btn ghost" data-act="close">Annulla</button></div></div></div>';
  document.getElementById('sheet').innerHTML=h;
  document.body.style.overflow='hidden';
}
function updateRv(){
  var cs=document.querySelectorAll('.rvc');var n=0;
  for(var i=0;i<cs.length;i++)if(cs[i].checked)n++;
  var b=document.getElementById('rvadd');if(!b)return;
  b.textContent='Aggiungi '+n+(n===1?' impegno':' impegni')+' al calendario';
  b.disabled=(n===0);
}
function toggleAllRv(el){
  var cs=document.querySelectorAll('.rvc');var all=true;
  for(var i=0;i<cs.length;i++)if(!cs[i].checked)all=false;
  for(var j=0;j<cs.length;j++)cs[j].checked=!all;
  el.textContent=all?'Seleziona tutte':'Deseleziona tutte';
  updateRv();
}
function confirmReview(){
  var found=sheet.found,name=sheet.name,added=[],sc=defSchool();
  var cs=document.querySelectorAll('.rvc'),ti=document.querySelectorAll('.rvt'),ts=document.querySelectorAll('.rvs'),te=document.querySelectorAll('.rve'),ds=document.querySelectorAll('.rvd');
  for(var i=0;i<cs.length;i++){
    if(!cs[i].checked)continue;
    var f=found[Number(cs[i].dataset.i)];
    var title=(ti[i].value||'').trim()||'Impegno';
    var dd=(ds[i]&&/^\d{4}-\d{2}-\d{2}$/.test(ds[i].value))?ds[i].value:f.date;
    var nt=f.note||'';
    if(dd!==f.date)nt=nt.replace('Il giorno della settimana non coincide con la data: controlla.','').trim();
    var dup=state.events.concat(added).some(function(e){return e.school===sc&&e.date===dd&&e.title.toLowerCase()===title.toLowerCase()});
    if(dup)continue;
    var st=ts[i]?(ts[i].value||''):f.start,en=te[i]?(te[i].value||''):f.end;
    if(!st||(en&&en<=st))en='';
    added.push({id:uid(),school:sc,title:title,type:guessType(title),date:dd,start:st,end:en,place:'',notes:nt,src:'pdf'});
  }
  closeSheet();
  if(!added.length){flash='Non ho aggiunto nulla: gli impegni scelti erano già nel calendario.';render();return}
  state.events=state.events.concat(added);
  state.docs.unshift({id:uid(),name:name,added:Date.now(),count:added.length});
  save();
  added.sort(function(a,b){return a.date.localeCompare(b.date)});
  var first=parse(added[0].date);
  cal=new Date(first.getFullYear(),first.getMonth(),1);calSel=added[0].date;
  flash='Ho aggiunto '+added.length+(added.length===1?' impegno':' impegni')+' al calendario.';
  cur='cal';render();resetScroll();
}

function avviaAgenda(){if(window.__agendaAvviata)return;window.__agendaAvviata=1;
(function () {
  var KEY = "agenda-docente.v3";
  function blank() {
    var id = "s" + Math.random().toString(36).slice(2, 10);
    return {
      v: 3, sample: false, noteOpen: false, school: id,
      schools: [{ id: id, name: "La mia scuola" }],
      events: [], lessons: [], tasks: [], contacts: [], notes: [], docs: [],
      classes: [], students: [], grades: [], absences: [], subs: [], links: [], archive: [],
      snotes: [], logs: [],
      remind: { evMin: "15", evEve: true, evEveTime: "20:00", tkEve: true, tkEveTime: "20:00", tkMorn: true, tkMornTime: "08:00" }
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.events)) return blank();
      data.sample = false;
      data.noteOpen = false;
      return data;
    } catch (e) { return blank(); }
  }
  function fillAccount() {
    var el = document.getElementById("account-slot");
    if (!el || el.dataset.ready === "1") return;
    el.dataset.ready = "1";
    el.innerHTML = '<div class="flex"><span style="border-radius:50%;background:var(--blue);color:var(--on-blue);display:flex;align-items:center;justify-content:center;font-weight:700">D</span><span><strong style="display:block">Docente</strong><span class="m">Su questo dispositivo</span></span></div>';
  }
  window.startAgenda({
    initialState: load(),
    persist: function (state) { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} },
    onRender: fillAccount,
    makeRecoveryCode: function () {
      var alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      var bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      var out = "";
      for (var i = 0; i < 16; i++) out += alphabet[bytes[i] % alphabet.length];
      var code = out.slice(0, 4) + "-" + out.slice(4, 8) + "-" + out.slice(8, 12) + "-" + out.slice(12, 16);
      try { localStorage.setItem("agenda-docente.recovery", code); } catch (e) {}
      return Promise.resolve(code);
    }
  });
})();
}
